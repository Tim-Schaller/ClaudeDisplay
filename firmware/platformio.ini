; Firmware für das Claude-Usage-Display (ESP32-2432S028 "Cheap Yellow Display").
;
; app:          Anzeige für Boards mit ST7789-Panel (Standard; getestet mit der
;               Dual-USB-Revision, Micro-USB + USB-C, Controller-ID 81 81 B3).
; app-ili9341:  Anzeige für Boards mit ILI9341-Panel (ursprüngliche CYD-Revision).
; test-ili9341,
; test-st7789:  Testbild (Farbbalken), um den Panel-Typ per Sichttest zu bestimmen.
;
; Der COM-Port wird automatisch erkannt; bei mehreren Geräten mit --upload-port COMx angeben.

[platformio]
default_envs = app

[env]
platform = espressif32@^6
board = esp32dev
framework = arduino
upload_speed = 460800
monitor_speed = 115200
; Auto-Reset-Schaltung (RTS -> EN, DTR -> GPIO0): beim Monitor beide Leitungen
; inaktiv lassen, sonst startet das Board neu bzw. bleibt im Bootloader hängen.
monitor_dtr = 0
monitor_rts = 0
lib_deps = lovyan03/LovyanGFX@^1.2.0

[env:app]
build_flags = -DPANEL_ST7789
build_src_filter = +<app/>
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^7

[env:app-ili9341]
build_flags = -DPANEL_ILI9341
build_src_filter = +<app/>
lib_deps =
  ${env.lib_deps}
  bblanchon/ArduinoJson@^7

[env:test-ili9341]
build_flags = -DPANEL_ILI9341
build_src_filter = +<display_test.cpp>

[env:test-st7789]
build_flags = -DPANEL_ST7789
build_src_filter = +<display_test.cpp>
